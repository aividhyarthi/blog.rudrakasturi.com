name: Publish scheduled posts
# Checks for due posts once an hour. Each run publishes every post that's come due since the last check
# (see scripts/publish-due.mjs), so an hourly check loses nothing - a post just appears within the hour
# of its scheduled time instead of within 10 minutes. ~15 posts/day fits comfortably in this cadence.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: due
        run: node scripts/publish-due.mjs
      - name: Commit the stamp so the site rebuilds
        if: steps.due.outputs.changed == 'true'
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add .publish-stamp
          git commit -m "Publish scheduled posts"
          git push origin HEAD:main
