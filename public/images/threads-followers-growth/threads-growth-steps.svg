<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 932" role="img" aria-label="Four steps to grow Threads followers: cross-promote from Instagram, reply inside bigger conversations, post consistently, track what actually gets replies"><rect width="800" height="932" rx="24" fill="#fff4ea"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="32" font-weight="800" fill="#331a00">Growing on Threads</text>
<text x="40" y="108" font-size="22" fill="#8a5a1f">Advice here is third-party, not official Meta guidance</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#e8780a"/>
<text x="70" y="190" font-size="27" font-weight="800" fill="#fff">1. Cross-promote from Instagram</text>
<text x="70" y="232" font-size="22" fill="#ffe9d3">Tell an audience you already have</text>
<text x="70" y="264" font-size="22" fill="#ffe9d3">that you post on Threads</text>
<path d="M400 298 v24" stroke="#b85c06" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#b85c06"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#b85c06"/>
<text x="70" y="400" font-size="27" font-weight="800" fill="#fff">2. Reply inside bigger conversations</text>
<text x="70" y="442" font-size="22" fill="#ffe3c4">A useful reply on a larger account's</text>
<text x="70" y="474" font-size="22" fill="#ffe3c4">post is seen by more people than a solo post</text>
<path d="M400 508 v24" stroke="#8a4304" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#8a4304"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#8a4304"/>
<text x="70" y="610" font-size="27" font-weight="800" fill="#fff">3. Post on a cadence you can sustain</text>
<text x="70" y="652" font-size="22" fill="#ffe3c4">Sources disagree on 3-5/week vs</text>
<text x="70" y="684" font-size="22" fill="#ffe3c4">daily; pick one you can actually keep</text>
<path d="M400 718 v24" stroke="#5c2c02" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#5c2c02"/>
<rect x="40" y="770" width="720" height="122" rx="18" fill="#5c2c02"/>
<text x="70" y="820" font-size="27" font-weight="800" fill="#fff">4. Track what actually gets replies</text>
<text x="70" y="862" font-size="22" fill="#ffe3c4">Repeat the format that works, not the vibe</text>
</g></svg>
