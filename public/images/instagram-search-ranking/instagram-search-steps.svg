<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 932" role="img" aria-label="Four steps to rank a brand or topic in Instagram Search: keyword-rich bio and username, captions written as search phrases, on-screen text and audio, consistent topic signals over time"><rect width="800" height="932" rx="24" fill="#fef1f8"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="30" font-weight="800" fill="#330b24">Ranking in Instagram Search</text>
<text x="40" y="108" font-size="22" fill="#8a3f6a">Search is a separate ranking system from Feed and Explore</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#c2267a"/>
<text x="70" y="190" font-size="27" font-weight="800" fill="#fff">1. Keyword-clear bio and username</text>
<text x="70" y="232" font-size="22" fill="#ffe3f1">Search reads bios and usernames,</text>
<text x="70" y="264" font-size="22" fill="#ffe3f1">not just captions</text>
<path d="M400 298 v24" stroke="#8f1a59" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#8f1a59"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#8f1a59"/>
<text x="70" y="400" font-size="27" font-weight="800" fill="#fff">2. Captions written as search phrases</text>
<text x="70" y="442" font-size="22" fill="#fcdcee">Hashtags help search but reportedly</text>
<text x="70" y="474" font-size="22" fill="#fcdcee">do not add reach on their own</text>
<path d="M400 508 v24" stroke="#630f3d" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#630f3d"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#630f3d"/>
<text x="70" y="610" font-size="27" font-weight="800" fill="#fff">3. On-screen text and spoken audio</text>
<text x="70" y="652" font-size="22" fill="#fcdcee">Reels and Search both reportedly</text>
<text x="70" y="684" font-size="22" fill="#fcdcee">read what is shown and said</text>
<path d="M400 718 v24" stroke="#3d0a27" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#3d0a27"/>
<rect x="40" y="770" width="720" height="122" rx="18" fill="#3d0a27"/>
<text x="70" y="820" font-size="27" font-weight="800" fill="#fff">4. Stay on-topic over time</text>
<text x="70" y="862" font-size="22" fill="#fcdcee">One clear niche beats scattered posts</text>
</g></svg>
