<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Carousel markup: ItemList with one supported type, complete list, matching text, positions, and valid items">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Carousel markup</text>
<text x="40" y="108" font-size="24" fill="#4a5280">ItemList for host carousels</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Pick a supported type</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Course list, Movie, Recipe or Restaurant</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">Cards must come from your own site</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Use one type per list</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Do not mix recipes with other items</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">Include every item on the page</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Match the visible page</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Text users see should be similar to the</text>
<text x="70" y="684" font-size="25" fill="#ffffff">data in the markup, in order</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Validate every item</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Two or more ListItem elements, and each</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">linked page must have valid markup</text>
</g></svg>
