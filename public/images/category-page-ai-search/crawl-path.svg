<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" role="img" aria-label="How crawlers reach products on an ecommerce site: home page links to category pages, which link to subcategory pages, which link to every product page; a sitemap or Merchant Center feed is the backup">
<rect width="800" height="960" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Make every product reachable</text>
<text x="40" y="108" font-size="24" fill="#4a5280">As described in Google's ecommerce guidance</text>

<rect x="40" y="140" width="720" height="110" rx="18" fill="#2340f5"/>
<text x="70" y="188" font-size="30" font-weight="800" fill="#fff">Home page</text>
<text x="70" y="226" font-size="25" fill="#e3e8ff">Link to your best categories</text>

<path d="M400 256 v28" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 276 l20 24 l20 -24z" fill="#7a3cff"/>

<rect x="40" y="308" width="720" height="110" rx="18" fill="#7a3cff"/>
<text x="70" y="356" font-size="30" font-weight="800" fill="#fff">Category pages</text>
<text x="70" y="394" font-size="25" fill="#ece1ff">Menus link to every category</text>

<path d="M400 424 v28" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 444 l20 24 l20 -24z" fill="#ff5a1f"/>

<rect x="40" y="476" width="720" height="110" rx="18" fill="#ff5a1f"/>
<text x="70" y="524" font-size="30" font-weight="800" fill="#fff">Subcategory pages</text>
<text x="70" y="562" font-size="25" fill="#fff">Plain links to the next level</text>

<path d="M400 592 v28" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 612 l20 24 l20 -24z" fill="#0b8f6a"/>

<rect x="40" y="644" width="720" height="130" rx="18" fill="#0b8f6a"/>
<text x="70" y="692" font-size="30" font-weight="800" fill="#fff">Every product page</text>
<text x="70" y="730" font-size="25" fill="#e8fff6">Use a href links, not button</text>
<text x="70" y="758" font-size="25" fill="#e8fff6">scripts, so crawlers can follow</text>

<rect x="40" y="800" width="720" height="130" rx="18" fill="#fff" stroke="#c9cff0" stroke-width="3"/>
<text x="70" y="848" font-size="28" font-weight="800" fill="#0b1030">Backup routes</text>
<text x="70" y="886" font-size="25" fill="#4a5280">A sitemap or a Merchant Center</text>
<text x="70" y="914" font-size="25" fill="#4a5280">feed can list pages links miss</text>
</g></svg>
