<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 976" role="img" aria-label="The four-part pattern of a grocery store apple guide: one question, a picker above the fold, the same block for every item, and real-world proof">
<rect width="800" height="976" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">The apple guide pattern</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Why one grocery page ranks for 15+ keywords</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">One searcher question</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">"Types of apples": a single job for</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">the whole page, stated in the title</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">A picker above the fold</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Sweetness chart and quick picks by use:</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">pie, snacking, sauce, cheese board</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">Same block, every item</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Photo, sweetness label, what it is good</text>
<text x="70" y="684" font-size="25" fill="#ffffff">for, and one honest limit per apple</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">Real-world proof</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Buying and storage tips, local voice and</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">a next step. Ours must be first-hand too</text>
</g></svg>
