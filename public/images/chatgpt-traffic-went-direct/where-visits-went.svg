<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="How ChatGPT visits moved into Direct in October: tagged links before 8 October, no tag and no referrer from 8 to 15 October, Direct rising as a result, and the tag returning around 15 to 16 October without correcting history">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Where did ChatGPT visits go?</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Into "Direct", per the October reports</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">Before 8 Oct: tagged links</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Links carry utm_source=chatgpt.com,</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">so analytics credits ChatGPT</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">8 to 15 Oct: no tag, no referrer</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Links open with noreferrer, so the</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">visit looks like a typed URL</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">Result: Direct goes up</text>
<text x="70" y="652" font-size="25" fill="#ffffff">On about 500 pages ChatGPT fell and</text>
<text x="70" y="684" font-size="25" fill="#ffffff">Direct rose by almost as much</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">About 15 to 16 Oct: tag back</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">History is not corrected, so mark</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">the dates and compare like with like</text>
</g></svg>
