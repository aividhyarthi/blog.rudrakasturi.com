<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Product data scorecard: one product per page, buyable on the page, markup in the initial HTML, one currency per URL">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Product data for shopping</text>
<text x="40" y="108" font-size="24" fill="#4a5280">A scorecard for product pages</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. One product per page</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Variants may share a page or have URLs</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">A category page is not a product page</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. The shopper can buy it there</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Pages that only link elsewhere</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">are not eligible for merchant listings</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Markup in the first HTML</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Script-built markup can slow Shopping</text>
<text x="70" y="684" font-size="25" fill="#ffffff">crawls of price and stock changes</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. One URL per currency</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Selling in two currencies needs</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">two distinct URLs, one for each</text>
</g></svg>
