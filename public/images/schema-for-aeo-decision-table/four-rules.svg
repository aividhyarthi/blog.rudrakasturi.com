<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="Four rules for schema markup in the AI search era: mark up what people see, use the most specific type, keep it crawlable, and expect no guarantee">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Schema for AI search: four rules</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Accuracy first, AI second</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Mark up what people see</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Structured data must match visible</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">content, never hidden or misleading</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Use the most specific type</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Choose the schema.org type that fits</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">the page, and fill required properties</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Keep it crawlable</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Do not block pages or image URLs;</text>
<text x="70" y="684" font-size="25" fill="#ffffff">JSON-LD is the recommended format</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Expect no guarantee</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Markup makes a feature possible, not</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">certain, and no special AI markup exists</text>
</g></svg>
