<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 932" role="img" aria-label="Four checks for a local business page: consistent name address and phone, LocalBusiness markup, a page per location, and an up-to-date business profile">
<rect width="800" height="932" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Local page: four checks</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Be easy to find, match and trust</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Same name, address, phone</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Identical on your site, profile and</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">listings</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. LocalBusiness markup</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Name and address are required;</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">add as many details as apply</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="122" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. A page for each location</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Real services, hours and directions</text>
<path d="M400 686 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 704 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="738" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="788" font-size="30" font-weight="800" fill="#fff">4. Keep profiles up to date</text>
<text x="70" y="830" font-size="25" fill="#e8fff6">Google lists Business Profile as a</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">check for AI features</text>
</g></svg>
