<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="A map of what you control, what you can influence and what you cannot control when trying to be cited by AI search, ending with the advice to promise work and not results">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Citations: what you can control</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Nobody can guarantee an AI citation</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">You control</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Crawlable, indexable pages, clear</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">answers and honest, accurate facts</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">You can influence</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Original evidence, reviews and</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">mentions earned from real customers</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">You cannot control</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Which sources a system picks, how</text>
<text x="70" y="684" font-size="25" fill="#ffffff">answers change, or what it shows</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">So promise work, not results</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Judge advice by the actions it</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">lists, not by a promised citation</text>
</g></svg>
