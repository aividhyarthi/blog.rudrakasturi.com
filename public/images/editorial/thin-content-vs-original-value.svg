<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Thin content compared with original editorial value</title><desc id="desc">Thin content repeats easily available facts, generic definitions and common tips, which an AI answer may summarise. Pages with original reporting, verified evidence, real experience, expert judgement and useful tools give readers a stronger reason to visit.</desc>
<rect width="1200" height="675" fill="#fff"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">What makes a page worth visiting?</text><text x="70" y="120" font-family="Arial,sans-serif" font-size="20" fill="#526071">The difference is not word count. It is the value the page adds.</text>
<rect x="70" y="175" width="500" height="400" rx="18" fill="#f8f1ef" stroke="#e6c8c0"/><rect x="630" y="175" width="500" height="400" rx="18" fill="#eef5f0" stroke="#c7ddce"/>
<text x="105" y="230" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#8d3c2e">Thin content</text><text x="665" y="230" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#246342">Distinct editorial value</text>
<g font-family="Arial,sans-serif" font-size="21" fill="#354052"><text x="110" y="295">• Repeats common facts</text><text x="110" y="350">• Rewrites other websites</text><text x="110" y="405">• Lists generic tips</text><text x="110" y="460">• Adds no evidence or experience</text><text x="110" y="515">• Gives no useful next step</text>
<text x="670" y="295">• Original reporting</text><text x="670" y="350">• Verified data and sources</text><text x="670" y="405">• Genuine first-hand experience</text><text x="670" y="460">• Expert judgement and context</text><text x="670" y="515">• Tools, examples or decisions</text></g>
<text x="105" y="615" font-family="Arial,sans-serif" font-size="17" fill="#8d3c2e">Easy for an AI answer to replace</text><text x="665" y="615" font-family="Arial,sans-serif" font-size="17" fill="#246342">Gives a reader a reason to visit</text>
<text x="70" y="650" font-family="Arial,sans-serif" font-size="14" fill="#6b7788">Editorial interpretation of Liz Reid's comments. Not a Google ranking formula.</text></svg>