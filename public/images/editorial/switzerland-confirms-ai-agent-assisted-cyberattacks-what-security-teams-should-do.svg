<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="927" viewBox="0 0 1600 927"><rect width="1600" height="927" fill="#fff"/><path d="M70 184H1530" stroke="#111" stroke-width="3"/><text x="70" y="70" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" fill="#111"><tspan x="70" dy="0">Switzerland Confirms AI Agent-Assisted Cyberattacks. What Security Teams</tspan><tspan x="70" dy="46">Should Do</tspan></text><text x="70" y="159" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#2458a6">RUDRAKASTURI.COM | EDITORIAL EXPLAINER</text><rect x="70" y="310" width="300" height="270" rx="18" fill="#fff8f4" stroke="#f36b3b" stroke-width="4"/><circle cx="115" cy="355" r="23" fill="#f36b3b"/><text x="115" y="363" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">1</text><text x="98" y="430" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">RECONNAISSANCE</text><text x="98" y="482" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111"><tspan x="98" dy="0">Agent maps exposed</tspan><tspan x="98" dy="22">systems</tspan></text><text x="98" y="530" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#2458a6">KEY STEP</text><rect x="455" y="310" width="300" height="270" rx="18" fill="#f4f8ff" stroke="#2458a6" stroke-width="4"/><circle cx="500" cy="355" r="23" fill="#2458a6"/><text x="500" y="363" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">2</text><text x="483" y="430" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">EXPLOIT</text><text x="483" y="482" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111"><tspan x="483" dy="0">Finds and chains</tspan><tspan x="483" dy="22">weaknesses</tspan></text><text x="483" y="530" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#2458a6">KEY STEP</text><rect x="840" y="310" width="300" height="270" rx="18" fill="#fff8f4" stroke="#f36b3b" stroke-width="4"/><circle cx="885" cy="355" r="23" fill="#f36b3b"/><text x="885" y="363" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">3</text><text x="868" y="430" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">DETECTION</text><text x="868" y="482" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111"><tspan x="868" dy="0">Spot unusual identities and</tspan><tspan x="868" dy="22">traffic</tspan></text><text x="868" y="530" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#2458a6">KEY STEP</text><rect x="1225" y="310" width="300" height="270" rx="18" fill="#f4f8ff" stroke="#2458a6" stroke-width="4"/><circle cx="1270" cy="355" r="23" fill="#2458a6"/><text x="1270" y="363" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">4</text><text x="1253" y="430" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">DEFENCE</text><text x="1253" y="482" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111"><tspan x="1253" dy="0">Patch, MFA and least</tspan><tspan x="1253" dy="22">privilege</tspan></text><text x="1253" y="530" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#2458a6">CHECK THE EVIDENCE</text><path d="M380 445H437l-16 -12m16 12l-16 12" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M765 445H822l-16 -12m16 12l-16 12" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1150 445H1207l-16 -12m16 12l-16 12" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="700" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#111">THE PRACTICAL QUESTION</text><text x="70" y="752" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111"><tspan x="70" dy="0">S