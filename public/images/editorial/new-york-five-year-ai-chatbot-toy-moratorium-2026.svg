-weight="700" fill="#fff">3</text><text x="868" y="430" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">MORATORIUM</text><text x="868" y="482" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111">Five years in New York</text><text x="868" y="530" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#2458a6">KEY STEP</text><rect x="1225" y="310" width="300" height="270" rx="18" fill="#f4f8ff" stroke="#2458a6" stroke-width="4"/><circle cx="1270" cy="355" r="23" fill="#2458a6"/><text x="1270" y="363" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">4</text><text x="1253" y="430" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111">EFFECTIVE DATE</text><text x="1253" y="482" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111">Check final law and guidance</text><text x="1253" y="530" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#2458a6">CHECK THE EVIDENCE</text><path d="M380 445H437l-16 -12m16 12l-16 12" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M765 445H822l-16 -12m16 12l-16 12" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1150 445H1207l-16 -12m16 12l-16 12" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="700" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#111">THE PRACTICAL QUESTION</text><text x="70" y="752" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#111">New York has signed a five-year moratorium on toys with embedded or integrated AI companion chatbots. The law is narrower than a ban on all AI-enabled toys.</text><path d="M70 790H1530" stroke="#111" stroke-width="2"/><text x="70" y="840" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#111">Original editorial diagram 