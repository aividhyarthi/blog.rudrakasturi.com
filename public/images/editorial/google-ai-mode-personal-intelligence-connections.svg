<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How Personal Intelligence connects apps to Google AI Mode</title><desc id="desc">Google AI Mode can use optional personal context from Google Wallet, Google Drive and the Gemini app to tailor a response. Wallet access is described by Google as read-only. Drive and Gemini app support were planned to roll out in the coming weeks.</desc>
<rect width="1200" height="675" fill="#fff"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">How Personal Intelligence connects to AI Mode</text><text x="70" y="120" font-family="Arial,sans-serif" font-size="20" fill="#526071">Optional app connections can add personal context to an AI search response</text>
<rect x="75" y="195" width="275" height="105" rx="16" fill="#f3f6fa" stroke="#d6deea"/><text x="105" y="238" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Google Wallet</text><text x="105" y="272" font-family="Arial,sans-serif" font-size="17" fill="#526071">Spending and linked cards</text>
<rect x="75" y="350" width="275" height="105" rx="16" fill="#f3f6fa" stroke="#d6deea"/><text x="105" y="393" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Google Drive</text><text x="105" y="427" font-family="Arial,sans-serif" font-size="17" fill="#526071">Documents, sheets and PDFs</text>
<rect x="75" y="505" width="275" height="105" rx="16" fill="#f3f6fa" stroke="#d6deea"/><text x="105" y="548" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Gemini app</text><text x="105" y="582" font-family="Arial,sans-serif" font-size="17" fill="#526071">Previous Gemini context</text>
<g stroke="#8293a8" stroke-width="4" fill="none"><path d="M350 247 H500 V370 H585"/><path d="M350 402 H585"/><path d="M350 557 H500 V434 H585"/></g><path d="M570 355 L590 370 L570 385" fill="none" stroke="#8293a8" stroke-width="4"/>
<rect x="590" y="300" width="260" height="140" rx="20" fill="#eaf1fb" stroke="#9eb7d9" stroke-width="2"/><text x="720" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#173f78">AI Mode</text><text x="720" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#425a78">Personalised response</text>
<path d="M850 370 H945" stroke="#8293a8" stroke-width="4"/><path d="M930 355 L950 370 L930 385" fill="none" stroke="#8293a8" stroke-width="4"/>
<rect x="955" y="300" width="190" height="140" rx="20" fill="#f3f6fa" stroke="#d6deea"/><text x="1050" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Your answer</text><text x="1050" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526071">Web + selected</text><text x="1050" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526071">personal context</text>
<text x="75" y="646" font-family="Arial,sans-serif" font-size="15" fill="#526071">Connections are optional. Google describes Wallet access as read-only. Availability of Drive and Gemini connections is staged.</text></svg>