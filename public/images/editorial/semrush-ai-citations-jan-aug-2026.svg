<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Semrush AI citation trends, January to August 2026</title><desc id="desc">Citations to 18 tracked social and user-generated content domains rose from 75.8 million to 115.5 million across Google AI products, up 52 percent. The same group fell from 18 million to 10.1 million in ChatGPT, down 44 percent.</desc>
<rect width="1200" height="675" fill="#ffffff"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">AI search citations moved in different directions</text><text x="70" y="118" font-family="Arial,sans-serif" font-size="20" fill="#526071">Monthly citations to 18 tracked social and user-generated content domains</text>
<rect x="65" y="155" width="520" height="390" rx="18" fill="#f3f6fa"/><rect x="615" y="155" width="520" height="390" rx="18" fill="#f3f6fa"/>
<text x="100" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172033">Google AI products</text><text x="100" y="240" font-family="Arial,sans-serif" font-size="18" fill="#526071">AI Overviews, AI Mode and Gemini</text>
<text x="100" y="300" font-family="Arial,sans-serif" font-size="17" fill="#526071">January 2026</text><rect x="100" y="316" width="270" height="34" rx="7" fill="#9aabc0"/><text x="385" y="341" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">75.8M</text>
<text x="100" y="395" font-family="Arial,sans-serif" font-size="17" fill="#526071">August 2026</text><rect x="100" y="411" width="411" height="34" rx="7" fill="#2359a8"/><text x="100" y="493" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#176b45">+52%</text><text x="220" y="493" font-family="Arial,sans-serif" font-size="18" fill="#526071">75.8M to 115.5M</text>
<text x="650" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172033">ChatGPT</text><text x="650" y="240" font-family="Arial,sans-serif" font-size="18" fill="#526071">Same 18 tracked domains</text>
<text x="650" y="300" font-family="Arial,sans-serif" font-size="17" fill="#526071">January 2026</text><rect x="650" y="316" width="411" height="34" rx="7" fill="#9aabc0"/><text x="1075" y="341" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172033">18.0M</text>
<text x="650" y="395" font-family="Arial,sans-serif" font-size="17" fill="#526071">August 2026</text><rect x="650" y="411" width="231" height="34" rx="7" fill="#a64c3b"/><text x="650" y="493" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#a33d2d">−44%</text><text x="770" y="493" font-family="Arial,sans-serif" font-size="18" fill="#526071">18.0M to 10.1M</text>
<text x="70" y="592" font-family="Arial,sans-serif" font-size="16" fill="#526071">Source: Semrush, January to August 2026 US prompt dataset. Values cover 18 selected domains, not all AI citations.</text><text x="70" y="625" font-family="Arial,sans-serif" font-size="15" fill="#6b7788">Chart recreated from the published study. Growth percentages are reported by Semrush.</text></svg>