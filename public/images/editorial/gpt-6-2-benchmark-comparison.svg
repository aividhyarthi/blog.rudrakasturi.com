<text x="70" y="620" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526071">Source: OpenAI ChatGPT release notes, November 2026. Company-reported results.</text>
<text x="70" y="646" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7788">* Lowest reasoning setting tested. ** Extra High reasoning setting. Scores do not guarantee real-world accuracy.</text>
