<title id="title">GPT-6.2 compared with GPT-6 on four published evaluations</title><desc id="desc">OpenAI reports GPT-6.2 scores of 71.7 versus 47.4 for image understanding, 78.1 versus 62.5 for complex instruction following, 65 versus 52 for expert-level tasks, and 64.5 versus 54.4 for BrowseComp.</desc>
