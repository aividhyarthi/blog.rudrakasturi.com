<title id="title">GPT-6.2 and GPT-6 benchmark comparison</title><desc id="desc">OpenAI reports GPT-6.2 scores compared with GPT-6: image understanding 71.7 versus 47.4 percent, complex instruction following 78.1 versus 62.5 percent, expert-level tasks 65 versus 52 percent, and BrowseComp 64.5 versus 54.4 percent.</desc>
<rect width="1200" height="675" fill="#fff"/>
<text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">GPT-6.2 benchmark scores compared with GPT-6</text>
<text x="70" y="110" font-family="Arial,sans-serif" font-size="19" fill="#526071">OpenAI-reported evaluation results, percentage score</text>
<rect x="70" y="140" width="20" height="18" fill="#2454f4"/><text x="100" y="156" font-family="Arial,sans-serif" font-size="16" fill="#526071">GPT-6</text><rect x="205" y="140" width="20" height="18" fill="#08a9e8"/><text x="235" y="156" font-family="Arial,sans-serif" font-size="16" fill="#526071">GPT-6.2</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#172033"><text x="70" y="220">Image understanding</text><text x="70" y="330">Complex instruction following</text><text x="70" y="440">Expert-level tasks*</text><text x="70" y="550">BrowseComp research**</text></g>
<g fill="#2454f4"><rect x="390" y="190" width="237" height="25"/><rect x="390" y="300" width="312" height="25"/><rect x="390" y="410" width="260" height="25"/><rect x="390" y="520" width="272" height="25"/></g>
<g fill="#08a9e8"><rect x="390" y="220" width="359" height="25"/><rect x="390" y="330" width="391" height="25"/><rect x="390" y="440" width="325" height="25"/><rect x="390" y="550" width="322" height="25"/></g>
<g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172033"><text x="640" y="210">47.4%</text><text x="762" y="240">71.7%</text><text x="715" y="320">62.5%</text><text x="794" y="350">78.1%</text><text x="663" y="430">52%</text><text x="728" y="460">65%</text><text x="675" y="540">54.4%</text><text x="725" y="570">64.5%</text></g>
<text x="70" y="620" font-family="Arial,sans-serif" font-size="15" fill="#526071">Source: OpenAI ChatGPT release notes, November 2026. Company-reported results.</text><text x="70" y="646" font-family="Arial,sans-serif" font-size="14" fill="#6b7788">* Lowest reasoning setting tested. ** Extra High reasoning setting. Scores do not guarantee real-world accuracy.</text></svg>