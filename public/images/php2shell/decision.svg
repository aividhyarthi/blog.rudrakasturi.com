<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" role="img" aria-label="Decision guide: if you can update PHP now, update; if not, take the site offline until it is fixed">
<rect width="800" height="780" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Why "update or go offline"?</text>
<rect x="190" y="110" width="420" height="100" rx="18" fill="#0b1030"/>
<text x="400" y="170" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">Can you update PHP today?</text>
<path d="M300 210 L190 300" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M500 210 L610 300" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/>
<text x="165" y="262" font-size="28" font-weight="800" fill="#0b8f6a">Yes</text><text x="600" y="262" font-size="28" font-weight="800" fill="#ff5a1f">No</text>
<rect x="40" y="305" width="330" height="200" rx="18" fill="#0b8f6a"/>
<text x="205" y="365" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">Update now</text>
<text x="205" y="410" font-size="25" fill="#e8fff6" text-anchor="middle">Install the fixed version</text>
<text x="205" y="446" font-size="25" fill="#e8fff6" text-anchor="middle">of PHP and stay online.</text>
<rect x="430" y="305" width="330" height="200" rx="18" fill="#ff5a1f"/>
<text x="595" y="365" font-size="32" font-weight="800" fill="#fff" text-anchor="middle">Take it offline</text>
<text x="595" y="410" font-size="25" fill="#fff" text-anchor="middle">Keep the site down until</text>
<text x="595" y="446" font-size="25" fill="#fff" text-anchor="middle">it can be fixed.</text>
<rect x="40" y="550" width="720" height="180" rx="18" fill="#fff" stroke="#d9e0fb" stroke-width="3"/>
<text x="70" y="602" font-size="26" font-weight="800" fill="#0b1030">The reasoning:</text>
<text x="70" y="642" font-size="25" fill="#1c2349">A site that is switched off cannot be taken over.</text>
<text x="70" y="678" font-size="25" fill="#1c2349">A site that stays open and unpatched can.</text>
<text x="70" y="714" font-size="25" fill="#4a5280">This is advice from the FBI, CISA and others.</text>
</g></svg>
