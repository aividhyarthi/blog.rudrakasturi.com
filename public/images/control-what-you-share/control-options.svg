<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Options to control what Google shows: remove, password-protect, noindex, robots.txt for media, snippet controls, and the Search generative AI control">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Control what you share</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Choose the tool that fits the job</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Remove or protect it</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Delete it, or put it behind a password</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">The most certain way to keep it out</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Block indexing</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Use noindex so pages stay out of results</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">Do not combine with a robots.txt block</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Shape the snippet</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Robots meta tag, data-nosnippet and</text>
<text x="70" y="684" font-size="25" fill="#ffffff">X-Robots-Tag adjust what is shown</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Manage AI feature inclusion</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Search generative AI control is a</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">site-wide setting in Search Console</text>
</g></svg>
