<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Four checks for a job listing page: markup matches the visible page, one URL per job, tell Google about changes, expire closed jobs">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Job listing checks</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Four checks before and after you post</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Markup matches the page</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Title, employer, location and pay</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">must be visible on the page itself</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. One URL per job</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Duplicate copies need a canonical</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">so one page carries the signal</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Tell Google about changes</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Google recommends the Indexing API</text>
<text x="70" y="684" font-size="25" fill="#ffffff">for jobs, plus a sitemap for the site</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Expire closed jobs</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Past validThrough, a 404 or 410,</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">or remove the markup. Do it promptly</text>
</g></svg>
