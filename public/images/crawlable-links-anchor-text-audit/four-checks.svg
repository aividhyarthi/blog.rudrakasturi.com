<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="Four checks for links based on Google guidance: use a real a href link, use descriptive anchor text, give links context, and qualify paid, user-added or untrusted links">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Link audit in four checks</text>
<text x="40" y="108" font-size="24" fill="#4a5280">From Google guidance on links</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Use a real link</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">An a element with an href that</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">resolves to a web address</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Say what is there</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Descriptive anchor text, or alt</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">text when an image is the link</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Give it context</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Space links out and write the</text>
<text x="70" y="684" font-size="25" fill="#ffffff">sentence around each one</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Qualify some links</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Use sponsored, ugc or nofollow for</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">paid, user-added or untrusted links</text>
</g></svg>
