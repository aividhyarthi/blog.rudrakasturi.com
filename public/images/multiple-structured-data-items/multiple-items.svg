<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Multiple items on a page: pick the main type, nest related items or list separate ones, link with @id, mark up everything visible">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Multiple items on a page</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Nest, list and link</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Choose the main type</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">The type that matches the page focus</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">for example Recipe on a recipe page</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Nest or list</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Nest items that belong together, list</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">separate blocks for unrelated items</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Link with @id</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Use the same @id in both items so Google</text>
<text x="70" y="684" font-size="25" fill="#ffffff">knows the video is about the recipe</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Mark up all visible items</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">If you mark up reviews, include all</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">the reviews visible on the page</text>
</g></svg>
