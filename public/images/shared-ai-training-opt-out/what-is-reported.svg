<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="Summary of the reported shared AI training opt-out: announced on 30 October, a robots.txt style request, rollout dates differ by company, and it is a request that may reduce AI visibility">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Shared AI training opt-out</text>
<text x="40" y="108" font-size="24" fill="#4a5280">What has been reported so far</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">30 Oct: announced</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">OpenAI, Google, Microsoft and</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">Anthropic back one shared opt-out</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">What it is</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">A robots.txt-style request that</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">sites can use to refuse AI training</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">When it arrives</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Dates differ: Microsoft says 1 Feb</text>
<text x="70" y="684" font-size="25" fill="#ffffff">2027, Google 2027, OpenAI "months"</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">What it does not do</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">It is a request, not a lock, and</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">opting out may cut AI visibility</text>
</g></svg>
