<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-label="A blank AI visibility scorecard: five questions tested in ChatGPT, Google AI Mode and Copilot, each marked cited, mentioned or absent">
<rect width="800" height="640" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="66" font-size="36" font-weight="800" fill="#0b1030">Your 10-minute AEO scorecard</text>
<text x="40" y="102" font-size="22" fill="#4a5280">Print it, or copy it into a sheet. Date: ____ / ____ / ______</text>

<rect x="40" y="126" width="720" height="56" rx="12" fill="#0b1030"/>
<text x="62" y="162" font-size="20" font-weight="800" fill="#fff">Question to ask</text>
<text x="380" y="162" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">ChatGPT</text>
<text x="520" y="162" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">AI Mode</text>
<text x="660" y="162" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">Copilot</text>

<g font-size="19" fill="#0b1030">
<rect x="40" y="192" width="720" height="62" rx="12" fill="#fff" stroke="#d6dcff" stroke-width="2"/><text x="62" y="230" font-weight="700">1. What is [your topic]?</text>
<rect x="40" y="262" width="720" height="62" rx="12" fill="#fff" stroke="#d6dcff" stroke-width="2"/><text x="62" y="300" font-weight="700">2. Best [product] for [use]?</text>
<rect x="40" y="332" width="720" height="62" rx="12" fill="#fff" stroke="#d6dcff" stroke-width="2"/><text x="62" y="370" font-weight="700">3. How do I [task you teach]?</text>
<rect x="40" y="402" width="720" height="62" rx="12" fill="#fff" stroke="#d6dcff" stroke-width="2"/><text x="62" y="440" font-weight="700">4. [You] vs [rival]: which?</text>
<rect x="40" y="472" width="720" height="62" rx="12" fill="#fff" stroke="#d6dcff" stroke-width="2"/><text x="62" y="510" font-weight="700">5. Is [you] worth it?</text>
</g>
<g fill="none" stroke="#b9c2f5" stroke-width="2" stroke-dasharray="5 5">
<rect x="350" y="200" width="60" height="46" rx="10"/><rect x="490" y="200" width="60" height="46" rx="10"/><rect x="630" y="200" width="60" height="46" rx="10"/>
<rect x="350" y="270" width="60" height="46" rx="10"/><rect x="490" y="270" width="60" height="46" rx="10"/><rect x="630" y="270" width="60" height="46" rx="10"/>
<rect x="350" y="340" width="60" height="46" rx="10"/><rect x="490" y="340" width="60" height="46" rx="10"/><rect x="630" y="340" width="60" height="46" rx="10"/>
<rect x="350" y="410" width="60" height="46" rx="10"/><rect x="490" y="410" width="60" height="46" rx="10"/><rect x="630" y="410" width="60" height="46" rx="10"/>
<rect x="350" y="480" width="60" height="46" rx="10"/><rect x="490" y="480" width="60" height="46" rx="10"/><rect x="630" y="480" width="60" height="46" rx="10"/>
</g>
<g font-size="19" fill="#0b1030">
<circle cx="62" cy="582" r="11" fill="#0b8f6a"/><text x="82" y="589" font-weight="700">C = Cited (link to you)</text>
<circle cx="322" cy="582" r="11" fill="#ff5a1f"/><text x="342" y="589" font-weight="700">M = Mentioned, no link</text>
<circle cx="600" cy="582" r="11" fill="#6a7090"/><text x="620" y="589" font-weight="700">A = Absent</text>
</g>
<text x="40" y="624" font-size="16" fill="#4a5280">Answers vary by person and by day. Treat one run as a sample.</text>
</g></svg>
