<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-label="Two versions of the same page: on the left the answer to which moisturiser is best for dry skin is buried after long background paragraphs; on the right the answer comes in the first two lines, ready to be extracted">
<rect width="800" height="680" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="66" font-size="36" font-weight="800" fill="#0b1030">Can an AI lift the answer?</text>
<text x="40" y="102" font-size="22" fill="#4a5280">Same question, two ways to write the page</text>
<rect x="40" y="126" width="720" height="62" rx="14" fill="#2340f5"/>
<text x="64" y="166" font-size="23" font-weight="800" fill="#fff">"Which moisturiser is best for dry skin?"</text>

<rect x="40" y="212" width="350" height="400" rx="18" fill="#e4e7f5"/>
<text x="64" y="248" font-size="17" font-weight="800" fill="#6a7090">HARD TO EXTRACT</text>
<g fill="#c3c8e2"><rect x="64" y="272" width="300" height="12" rx="6"/><rect x="64" y="296" width="270" height="12" rx="6"/><rect x="64" y="320" width="300" height="12" rx="6"/><rect x="64" y="344" width="220" height="12" rx="6"/><rect x="64" y="378" width="300" height="12" rx="6"/><rect x="64" y="402" width="280" height="12" rx="6"/><rect x="64" y="426" width="300" height="12" rx="6"/><rect x="64" y="450" width="190" height="12" rx="6"/></g>
<text x="64" y="500" font-size="19" fill="#4a5280">Answer starts in</text><text x="64" y="526" font-size="19" fill="#4a5280">paragraph four,</text><text x="64" y="552" font-size="19" fill="#4a5280">after general</text><text x="64" y="578" font-size="19" fill="#4a5280">background.</text>

<rect x="410" y="212" width="350" height="400" rx="18" fill="#0b8f6a"/>
<text x="434" y="248" font-size="17" font-weight="800" fill="#c8f5e4">EASY TO EXTRACT</text>
<text x="434" y="286" font-size="19" font-weight="800" fill="#fff">For dry skin, look for</text><text x="434" y="312" font-size="19" font-weight="800" fill="#fff">moisturisers with ceramides,</text><text x="434" y="338" font-size="19" font-weight="800" fill="#fff">hyaluronic acid, glycerin and</text><text x="434" y="364" font-size="19" font-weight="800" fill="#fff">shea butter. They help retain</text><text x="434" y="390" font-size="19" font-weight="800" fill="#fff">moisture and support the</text><text x="434" y="416" font-size="19" font-weight="800" fill="#fff">skin barrier.</text>
<g fill="#58c5a2"><rect x="434" y="446" width="300" height="12" rx="6"/><rect x="434" y="470" width="260" height="12" rx="6"/><rect x="434" y="494" width="300" height="12" rx="6"/></g>
<text x="434" y="544" font-size="19" fill="#e8fff6">Answer in the first lines,</text><text x="434" y="570" font-size="19" fill="#e8fff6">detail below it.</text>

<text x="40" y="646" font-size="17" fill="#4a5280">Illustrative example only. Not skincare advice.</text>
</g></svg>
