<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" role="img" aria-label="Four search terms compared: SEO gets pages ranked, AEO gets content chosen as the answer, GEO gets a brand mentioned in AI-written answers, ASO gets an app found in app stores">
<rect width="800" height="700" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="66" font-size="36" font-weight="800" fill="#0b1030">Which term is which?</text>
<text x="40" y="102" font-size="22" fill="#4a5280">Same family, different finish line</text>
<rect x="40" y="130" width="350" height="250" rx="18" fill="#2340f5"/>
<text x="64" y="180" font-size="40" font-weight="800" fill="#fff">SEO</text>
<text x="64" y="214" font-size="20" fill="#e3e8ff">Search engine optimization</text>
<text x="64" y="262" font-size="22" font-weight="700" fill="#fff">Win: a ranked blue link</text>
<text x="64" y="296" font-size="21" fill="#e3e8ff">Measure: rankings, clicks</text>
<text x="64" y="330" font-size="21" fill="#e3e8ff">Where: Google, Bing results</text>
<rect x="410" y="130" width="350" height="250" rx="18" fill="#7a3cff"/>
<text x="434" y="180" font-size="40" font-weight="800" fill="#fff">AEO</text>
<text x="434" y="214" font-size="20" fill="#ece1ff">Answer engine optimization</text>
<text x="434" y="262" font-size="22" font-weight="700" fill="#fff">Win: chosen as the answer</text>
<text x="434" y="296" font-size="21" fill="#ece1ff">Measure: citations, mentions</text>
<text x="434" y="330" font-size="21" fill="#ece1ff">Where: AI Overviews, ChatGPT</text>
<rect x="40" y="400" width="350" height="250" rx="18" fill="#ff5a1f"/>
<text x="64" y="450" font-size="40" font-weight="800" fill="#fff">GEO</text>
<text x="64" y="484" font-size="20" fill="#ffe6dc">Generative engine optimization</text>
<text x="64" y="532" font-size="22" font-weight="700" fill="#fff">Win: named in a written answer</text>
<text x="64" y="566" font-size="21" fill="#ffe6dc">Measure: brand mentions</text>
<text x="64" y="600" font-size="21" fill="#ffe6dc">Where: AI Mode, Perplexity</text>
<rect x="410" y="400" width="350" height="250" rx="18" fill="#0b8f6a"/>
<text x="434" y="450" font-size="40" font-weight="800" fill="#fff">ASO</text>
<text x="434" y="484" font-size="20" fill="#e8fff6">App store optimization</text>
<text x="434" y="532" font-size="22" font-weight="700" fill="#fff">Win: an app found and installed</text>
<text x="434" y="566" font-size="21" fill="#e8fff6">Measure: store views, installs</text>
<text x="434" y="600" font-size="21" fill="#e8fff6">Where: App Store, Google Play</text>
</g></svg>
