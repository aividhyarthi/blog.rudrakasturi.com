<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="How an AI answer is built: a person asks a question, the system runs several related searches, fetches indexed pages, writes an answer and shows links to its sources">
<rect width="800" height="900" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="66" font-size="36" font-weight="800" fill="#0b1030">How an AI answer gets built</text>
<text x="40" y="102" font-size="22" fill="#4a5280">AEO is about being useful at steps 3 and 5</text>
<rect x="40" y="130" width="720" height="110" rx="18" fill="#2340f5"/>
<text x="70" y="178" font-size="28" font-weight="800" fill="#fff">1. A person asks a question</text>
<text x="70" y="214" font-size="22" fill="#e3e8ff">"What is AEO and do I need it?"</text>
<path d="M400 244 v22" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 262 l20 22 l20 -22z" fill="#7a3cff"/>
<rect x="40" y="290" width="720" height="110" rx="18" fill="#7a3cff"/>
<text x="70" y="338" font-size="28" font-weight="800" fill="#fff">2. Related searches run at once</text>
<text x="70" y="374" font-size="22" fill="#ece1ff">Google calls this query fan-out</text>
<path d="M400 404 v22" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 422 l20 22 l20 -22z" fill="#ff5a1f"/>
<rect x="40" y="450" width="720" height="110" rx="18" fill="#ff5a1f"/>
<text x="70" y="498" font-size="28" font-weight="800" fill="#fff">3. Indexed pages are fetched</text>
<text x="70" y="534" font-size="22" fill="#ffe6dc">Your page must be crawlable and snippet-eligible</text>
<path d="M400 564 v22" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 582 l20 22 l20 -22z" fill="#0b8f6a"/>
<rect x="40" y="610" width="720" height="110" rx="18" fill="#0b8f6a"/>
<text x="70" y="658" font-size="28" font-weight="800" fill="#fff">4. The model writes the answer</text>
<text x="70" y="694" font-size="22" fill="#e8fff6">It pulls facts from the pages it fetched</text>
<path d="M400 724 v22" stroke="#0b1030" stroke-width="8" stroke-linecap="round"/><path d="M380 742 l20 22 l20 -22z" fill="#0b1030"/>
<rect x="40" y="770" width="720" height="110" rx="18" fill="#0b1030"/>
<text x="70" y="818" font-size="28" font-weight="800" fill="#fff">5. Sources are linked or named</text>
<text x="70" y="854" font-size="22" fill="#cfd6ff">Clear, original, quotable pages are easier to cite</text>
</g></svg>
