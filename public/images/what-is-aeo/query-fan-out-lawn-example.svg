<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" role="img" aria-label="Google's query fan-out example: one question about a lawn full of weeds becomes three related searches, pages are fetched for all of them, and one answer with links is written">
<rect width="800" height="820" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="66" font-size="36" font-weight="800" fill="#0b1030">One question, many searches</text>
<text x="40" y="102" font-size="22" fill="#4a5280">Google's own example of "query fan-out"</text>

<rect x="40" y="130" width="720" height="100" rx="18" fill="#2340f5"/>
<text x="70" y="170" font-size="18" font-weight="700" fill="#cfd6ff">THE PERSON TYPES</text>
<text x="70" y="206" font-size="27" font-weight="800" fill="#fff">"How to fix a lawn that's full of weeds"</text>

<path d="M400 234 v28" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 256 l20 24 l20 -24z" fill="#7a3cff"/>
<text x="420" y="262" font-size="18" fill="#4a5280">the AI adds related searches</text>

<rect x="40" y="290" width="224" height="140" rx="18" fill="#7a3cff"/>
<text x="152" y="338" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">"best herbicides</text><text x="152" y="366" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">for lawns"</text>
<rect x="288" y="290" width="224" height="140" rx="18" fill="#7a3cff"/>
<text x="400" y="338" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">"remove weeds</text><text x="400" y="366" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">without chemicals"</text>
<rect x="536" y="290" width="224" height="140" rx="18" fill="#7a3cff"/>
<text x="648" y="338" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">"how to prevent</text><text x="648" y="366" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">weeds in lawn"</text>

<path d="M400 434 v28" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 456 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="490" width="720" height="100" rx="18" fill="#ff5a1f"/>
<text x="70" y="532" font-size="27" font-weight="800" fill="#fff">Pages come from the Search index</text>
<text x="70" y="566" font-size="21" fill="#ffe6dc">for all of those searches, not only the typed one</text>

<path d="M400 594 v28" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 616 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="650" width="720" height="100" rx="18" fill="#0b8f6a"/>
<text x="70" y="692" font-size="27" font-weight="800" fill="#fff">One written answer, with links</text>
<text x="70" y="726" font-size="21" fill="#e8fff6">Pages that support the answer get the links</text>

<text x="40" y="790" font-size="18" fill="#4a5280">Source: Google Search Central, generative AI guide. Queries are Google's example.</text>
</g></svg>
