<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="Four steps to track AI referrals in analytics: find AI assistant referral sources, group them into one channel, judge their quality, and admit the gaps because the count is a floor">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Tracking AI referrals: four steps</text>
<text x="40" y="108" font-size="24" fill="#4a5280">A setup you can finish in an hour</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Find the sources</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">List referral sources that look like</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">AI assistants in your traffic report</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Group them</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Make one channel called AI assistants</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">so trends are easy to read</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Judge the quality</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Compare engagement, landing pages</text>
<text x="70" y="684" font-size="25" fill="#ffffff">and conversions with other channels</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Admit the gaps</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Some AI visits lose their referrer,</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">so treat the count as a floor</text>
</g></svg>
