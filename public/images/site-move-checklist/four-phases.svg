<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="Four phases of a site move based on Google guidance: prepare the new site, map every old URL, redirect and tell Google, then monitor and wait">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Site move in four phases</text>
<text x="40" y="108" font-size="24" fill="#4a5280">From Google migration guidance</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Prepare the new site</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Test it, plan robots.txt and noindex</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">changes, verify every variant in GSC</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Map every old URL</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">One old URL to one relevant new URL,</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">with canonicals and hreflang updated</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Redirect and tell Google</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Server-side 301 or 308 redirects, a new</text>
<text x="70" y="684" font-size="25" fill="#ffffff">sitemap, and Change of Address if needed</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Monitor and wait</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Watch both sites, keep redirects at</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">least a year, expect a few weeks</text>
</g></svg>
