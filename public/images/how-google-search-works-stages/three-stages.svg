<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Google Search works in three stages: crawling, indexing and serving results, and a page can stall at any stage">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Three stages of Search</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Not every page makes it through all three</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Crawling</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Googlebot finds a URL through links</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">or a sitemap, then fetches the page</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Indexing</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Google analyses the text, images and video</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">and stores what it understood</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Serving results</text>
<text x="70" y="652" font-size="25" fill="#ffffff">When someone searches, Google returns</text>
<text x="70" y="684" font-size="25" fill="#ffffff">what is relevant to that query</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">Where pages get stuck</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Not found, not indexed, or not shown</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">Check the stage before you fix anything</text>
</g></svg>
