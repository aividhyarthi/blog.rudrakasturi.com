<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Faceted navigation decision flow: if people search for the filter make it a real page, if not stop crawling, then check">
<rect width="800" height="1000" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Faceted navigation: decide per filter</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Index it, or keep crawlers out</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">Does anyone search for it?</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">A filter people look for by name</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">such as &quot;red running shoes&quot;</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">Yes: make it a real page</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Clean URL, own title, links to it</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">404 when it has no results</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">No: stop crawling</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Block the parameters in robots.txt</text>
<text x="70" y="684" font-size="25" fill="#ffffff">or use fragments for the filter</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">Check the result</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Look at crawl stats and your logs</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">after two to four weeks</text>
</g></svg>
