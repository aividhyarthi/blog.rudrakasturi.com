<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="HTTP status codes: 2xx may be indexed, 3xx redirects are followed up to 10 hops, 4xx removes content over time, 5xx and 429 slow crawling">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Status codes and Google</text>
<text x="40" y="108" font-size="24" fill="#4a5280">What each group tells the crawler</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. 2xx: content is considered</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Indexing is not guaranteed, and an</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">empty page can show as a soft 404</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. 3xx: redirects are followed</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Up to 10 hops. 301 and 308 are strong</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">signals, 302 and 307 are weak</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. 4xx: content is not used</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Indexed URLs are removed over time</text>
<text x="70" y="684" font-size="25" fill="#ffffff">429 is treated as a server error</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. 5xx and 429: crawl slows</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Persistent errors can drop URLs</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">Crawling speeds up again after 2xx</text>
</g></svg>
