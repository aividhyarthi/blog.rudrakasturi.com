<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Before and after layout: on the left the answer sits at the bottom of the page under an introduction and background; on the right the direct answer comes first, followed by the detail">
<rect width="800" height="900" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Move the answer to the top</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Same content, different order</text>

<text x="40" y="168" font-size="30" font-weight="800" fill="#ff5a1f">Before</text>
<text x="420" y="168" font-size="30" font-weight="800" fill="#0b8f6a">After</text>

<rect x="40" y="190" width="340" height="110" rx="16" fill="#0b1030"/>
<text x="64" y="240" font-size="26" font-weight="800" fill="#fff">Long introduction</text>
<text x="64" y="274" font-size="24" fill="#c9cff0">Why this matters</text>

<rect x="40" y="316" width="340" height="110" rx="16" fill="#0b1030"/>
<text x="64" y="366" font-size="26" font-weight="800" fill="#fff">Background</text>
<text x="64" y="400" font-size="24" fill="#c9cff0">History and context</text>

<rect x="40" y="442" width="340" height="110" rx="16" fill="#0b1030"/>
<text x="64" y="492" font-size="26" font-weight="800" fill="#fff">Definitions</text>
<text x="64" y="526" font-size="24" fill="#c9cff0">Terms explained</text>

<rect x="40" y="568" width="340" height="130" rx="16" fill="#ff5a1f"/>
<text x="64" y="618" font-size="26" font-weight="800" fill="#fff">The answer</text>
<text x="64" y="652" font-size="24" fill="#fff">Finally, at the bottom</text>

<rect x="420" y="190" width="340" height="150" rx="16" fill="#0b8f6a"/>
<text x="444" y="240" font-size="26" font-weight="800" fill="#fff">The answer</text>
<text x="444" y="274" font-size="24" fill="#e8fff6">One or two clear</text>
<text x="444" y="306" font-size="24" fill="#e8fff6">sentences, first</text>

<rect x="420" y="356" width="340" height="110" rx="16" fill="#2340f5"/>
<text x="444" y="406" font-size="26" font-weight="800" fill="#fff">The detail</text>
<text x="444" y="440" font-size="24" fill="#e3e8ff">Steps, reasons, data</text>

<rect x="420" y="482" width="340" height="110" rx="16" fill="#7a3cff"/>
<text x="444" y="532" font-size="26" font-weight="800" fill="#fff">Context</text>
<text x="444" y="566" font-size="24" fill="#ece1ff">Background, if needed</text>

<rect x="420" y="608" width="340" height="90" rx="16" fill="#2340f5"/>
<text x="444" y="662" font-size="26" font-weight="800" fill="#fff">What to do next</text>

<rect x="40" y="740" width="720" height="120" rx="18" fill="#fff" stroke="#c9cff0" stroke-width="3"/>
<text x="70" y="790" font-size="26" font-weight="800" fill="#0b1030">Readers see the answer straight away</text>
<text x="70" y="826" font-size="24" fill="#4a5280">and can keep reading for the detail</text>
</g></svg>
