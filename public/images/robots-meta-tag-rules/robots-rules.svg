<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Robots rules: where to place them, which rules control indexing and which control snippets including AI Overviews and AI Mode">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Robots meta tag rules</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Snippet and index controls in one place</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Page rule or header rule</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Meta tag for HTML, X-Robots-Tag for files</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">Crawlers must be able to read the page</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Indexing rules</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">noindex, none, unavailable_after and</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">indexifembedded (needs noindex)</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Snippet rules</text>
<text x="70" y="652" font-size="25" fill="#ffffff">nosnippet, max-snippet and max-video-preview</text>
<text x="70" y="684" font-size="25" fill="#ffffff">apply to AI Overviews and AI Mode too</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Conflicts</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">The more restrictive rule applies</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">nosnippet beats max-snippet:50</text>
</g></svg>
