<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 974" role="img" aria-label="Judging AEO tools: check claims against Google guidance, separate opinion from official, treat tool data as estimates, confirm with Search Console">
<rect width="800" height="974" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Judging AEO and GEO tools</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Check claims before you act</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. List the claim</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Write down what the tool or advice says</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">and where it says Google said it</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Find the official page</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Supported by Google guidance, or opinion</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">Label each one clearly</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Treat tool data as estimates</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Third-party tools cannot see Google</text>
<text x="70" y="684" font-size="25" fill="#ffffff">internal ranking or AI systems</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Confirm in Search Console</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">First-party data from Google Search</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">Decide, date it and review</text>
</g></svg>
