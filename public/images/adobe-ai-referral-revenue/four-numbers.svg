<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 964" role="img" aria-label="Four Adobe figures for AI-referred visits to U.S. retail sites in September: 83 percent more revenue per visit, 90 percent higher conversion, higher engagement, and 71 percent year-on-year traffic growth">
<rect width="800" height="964" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">AI-referred shoppers vs others</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Adobe data, U.S. retail sites, September</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">83% more revenue per visit</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Revenue from each visit was higher</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">for visits that came from AI links</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">90% higher conversion rate</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">A larger share of AI-referred visits</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">ended in a purchase</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">More engaged on the site</text>
<text x="70" y="652" font-size="25" fill="#ffffff">73% more time, 25% more pages and a</text>
<text x="70" y="684" font-size="25" fill="#ffffff">53% higher add-to-cart rate</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">Fast growth in AI referrals</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">AI traffic up 71% year on year and</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">1,772% since tracking began</text>
</g></svg>
