<title id="title">ChatGPT retrieval position and citation rate</title><desc id="desc">Bars show 43.8 percent of first-ranked retrieved pages were cited, 35.5 percent of second-ranked pages, 12.2 percent of pages ranked sixth to tenth, and 3.5 percent of pages ranked eleventh to twentieth.</desc>
<rect width="1200" height="650" fill="#fff"/><text x="72" y="78" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#526579">RESEARCH FINDING 04</text><text x="72" y="132" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102a43">Higher retrieval positions were cited more often</text>
<text x="72" y="174" font-family="Arial,sans-serif" font-size="19" fill="#526579">Share of retrieved pages cited at each position in ChatGPT's list</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#183b56"><text x="72" y="265">First position</text><text x="72" y="355">Second position</text><text x="72" y="445">Positions 6–10</text><text x="72" y="535">Positions 11–20</text></g>
<g><rect x="350" y="225" width="700" height="48" rx="9" fill="#e8eef4"/><rect x="350" y="225" width="613" height="48" rx="9" fill="#1769aa"/><text x="980" y="259" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1769aa">43.8%</text>
<rect x="350" y="315" width="700" height="48" rx="9" fill="#e8eef4"/><rect x="350" y="315" width="497" height="48" rx="9" fill="#3985ba"/><text x="865" y="349" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1769aa">35.5%</text>
<rect x="350" y="405" width="700" height="48" rx="9" fill="#e8eef4"/><rect x="350" y="405" width="171" height="48" rx="9" fill="#75a9cc"/><text x="540" y="439" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1769aa">12.2%</text>
<rect x="350" y="495" width="700" height="48" rx="9" fill="#e8eef4"/><rect x="350" y="495" width="49" height="48" rx="9" fill="#d28a24"/><text x="418" y="529" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#a66a13">3.5%</text></g>
<text x="72" y="610" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Source: Chen &amp; Koudas (2026), Table 3. These are rates for pages at each retrieval position, not shares of all citations.</text>
