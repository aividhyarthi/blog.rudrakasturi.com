<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Schema and other page features across websites versus within websites</title><desc id="desc">A dot plot compares reported associations for FAQ blocks, schema markup, summary boxes and author information across websites and within the same website. Within-website values are not statistically significant.</desc>
<rect width="1200" height="760" fill="#fff"/><text x="70" y="76" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#526579">RESEARCH FINDING 02</text><text x="70" y="130" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#102a43">The apparent advantage changes</text>
<text x="70" y="170" font-family="Arial,sans-serif" font-size="19" fill="#526579">Reported citation associations for recommended page features</text>
<circle cx="720" cy="220" r="9" fill="#1769aa"/><text x="740" y="227" font-family="Arial,sans-serif" font-size="17" fill="#334e68">Across websites</text><circle cx="930" cy="220" r="9" fill="#d28a24"/><text x="950" y="227" font-family="Arial,sans-serif" font-size="17" fill="#334e68">Within same website</text>
<line x1="620" y1="265" x2="620" y2="610" stroke="#94a3b8" stroke-width="2"/><text x="620" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#64748b">0%</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#334e68"><text x="70" y="315">FAQ block</text><text x="70" y="395">Schema.org markup</text><text x="70" y="475">Summary box</text><text x="70" y="555">Author information</text></g>
<g stroke="#e2e8f0" stroke-width="2"><line x1="240" y1="305" x2="1080" y2="305"/><line x1="240" y1="385" x2="1080" y2="385"/><line x1="240" y1="465" x2="1080" y2="465"/><line x1="240" y1="545" x2="1080" y2="545"/></g>
<g fill="#1769aa"><circle cx="982" cy="305" r="11"/><circle cx="795" cy="385" r="11"/><circle cx="1080" cy="465" r="11"/><circle cx="899" cy="545" r="11"/></g>
<g fill="#d28a24"><circle cx="556" cy="328" r="11"/><circle cx="514" cy="408" r="11"/><circle cx="717" cy="488" r="11"/><circle cx="528" cy="568" r="11"/></g>
<g font-family="Arial,sans-serif" font-size="17" font-weight="700"><text x="997" y="311" fill="#1769aa">+18.1%</text><text x="810" y="391" fill="#1769aa">+7.5%</text><text x="1000" y="455" fill="#1769aa">+20.9%</text><text x="914" y="551" fill="#1769aa">+14.9%</text><text x="570" y="334" fill="#a66a13">−3.4%</text><text x="528" y="414" fill="#a66a13">−5.3%</text><text x="731" y="494" fill="#a66a13">+6.9%</text><text x="542" y="574" fill="#a66a13">−4.6%</text></g>
<rect x="70" y="665" width="1060" height="60" rx="12" fill="#f3f7fa"/><text x="92" y="702" font-family="Arial,sans-serif" font-size="17" fill="#526579">Within-website estimates were not statistically significant. Associations are not causal effects.</text>
</svg>