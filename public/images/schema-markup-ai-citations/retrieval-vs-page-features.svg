<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Retrieval versus page features in AI citation variation</title><desc id="desc">Horizontal bar comparison: retrieval explains 32 percent and page features explain 2.8 percent of within-website citation variation in the main ChatGPT analysis.</desc>
<rect width="1200" height="650" fill="#fff"/><text x="72" y="78" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#526579">RESEARCH FINDING 01</text>
<text x="72" y="132" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102a43">What explains citation variation?</text>
<text x="72" y="172" font-family="Arial,sans-serif" font-size="20" fill="#526579">Within-website analysis, ChatGPT main dataset</text>
<text x="72" y="265" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183b56">AI retrieval</text><rect x="330" y="224" width="720" height="62" rx="12" fill="#e8eef4"/><rect x="330" y="224" width="576" height="62" rx="12" fill="#1769aa"/><text x="930" y="265" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1769aa">32%</text>
<text x="72" y="385" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#183b56">Page features</text><rect x="330" y="344" width="720" height="62" rx="12" fill="#e8eef4"/><rect x="330" y="344" width="50.4" height="62" rx="12" fill="#d28a24"/><text x="405" y="385" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#a66a13">2.8%</text>
<rect x="72" y="470" width="1056" height="95" rx="14" fill="#f3f7fa"/><text x="100" y="510" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#102a43">What this means</text><text x="100" y="540" font-family="Arial,sans-serif" font-size="18" fill="#526579">The retrieval process explained more variation than the page features tested.</text>
<text x="72" y="612" font-family="Arial,sans-serif" font-size="15" fill="#64748b">Source: Chen &amp; Koudas (2026), arXiv:2610.15033, Table 3. Retrieval 32% (95% CI 24–42%); page features 2.8%.</text>
</svg>