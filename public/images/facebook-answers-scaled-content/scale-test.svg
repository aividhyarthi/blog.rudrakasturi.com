<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 976" role="img" aria-label="Four questions Google applies to scaled content, shown against Facebook Answers: many pages, purpose, added value and no ruling yet">
<rect width="800" height="976" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Is this scaled content abuse?</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Google's test, applied to Facebook Answers</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">Many pages, fast</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Millions of pages in weeks. Scale alone</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">is not the violation. Purpose is</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">Made to rank?</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Google asks if pages exist mainly to</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">manipulate rankings or to help people</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">Added value?</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Do pages add something, or restate and</text>
<text x="70" y="684" font-size="25" fill="#ffffff">overlap? 180 padel pages is a warning sign</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">Unclear: no ruling</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">No Google statement on these pages yet.</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">Do not copy the tactic. Watch and wait</text>
</g></svg>
