<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" role="img" aria-label="Google app search bar test: the current bar says Search; the tested bar is white, thinner, higher, has a plus button and says Ask Google">
<rect width="800" height="780" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">The search bar being tested</text>
<text x="40" y="108" font-size="24" fill="#4a5280">Google mobile app, as reported</text>
<text x="40" y="170" font-size="22" font-weight="800" fill="#4a5280" letter-spacing="2">NOW</text>
<rect x="40" y="190" width="720" height="96" rx="48" fill="#d9dce8"/>
<circle cx="100" cy="238" r="16" fill="none" stroke="#4a5280" stroke-width="5"/><path d="M112 250 l18 18" stroke="#4a5280" stroke-width="5" stroke-linecap="round"/>
<text x="160" y="250" font-size="30" fill="#4a5280">Search</text>
<path d="M400 306 v50" stroke="#2340f5" stroke-width="8" stroke-linecap="round"/><path d="M380 346 l20 24 l20 -24z" fill="#2340f5"/>
<text x="40" y="420" font-size="22" font-weight="800" fill="#2340f5" letter-spacing="2">IN THE TEST</text>
<rect x="40" y="440" width="720" height="80" rx="40" fill="#fff" stroke="#2340f5" stroke-width="4"/>
<circle cx="100" cy="480" r="22" fill="#2340f5"/><text x="100" y="492" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">+</text>
<text x="160" y="491" font-size="30" font-weight="800" fill="#0b1030">Ask Google</text>
<rect x="40" y="560" width="720" height="190" rx="18" fill="#0b1030"/>
<g font-size="25" fill="#e3e8ff"><text x="70" y="610">&#8226; Label changes from "Search" to "Ask Google"</text><text x="70" y="648">&#8226; A "+" button is added</text><text x="70" y="686">&#8226; White instead of gray, thinner and higher</text></g>
<text x="70" y="728" font-size="21" fill="#6ee7c8">A test. Google has not announced it.</text>
</g></svg>
