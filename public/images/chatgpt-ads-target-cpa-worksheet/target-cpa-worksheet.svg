<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 976" role="img" aria-label="Four-step worksheet for setting a realistic Target CPA in ChatGPT Ads: check signal, find actual CPA, set the target, review as it learns">
<rect width="800" height="976" rx="24" fill="#f1f4ff"/>
<g font-family="Archivo, Arial, Helvetica, sans-serif">
<text x="40" y="70" font-size="38" font-weight="800" fill="#0b1030">Set a realistic Target CPA</text>
<text x="40" y="108" font-size="24" fill="#4a5280">A four-step worksheet before 9 November</text>
<rect x="40" y="140" width="720" height="154" rx="18" fill="#2340f5"/>
<text x="70" y="190" font-size="30" font-weight="800" fill="#fff">1. Check the signal</text>
<text x="70" y="232" font-size="25" fill="#e3e8ff">Pixel or Conversions API sends the chosen</text>
<text x="70" y="264" font-size="25" fill="#e3e8ff">event. Review Event Quality Score warnings</text>
<path d="M400 298 v24" stroke="#7a3cff" stroke-width="8" stroke-linecap="round"/><path d="M380 316 l20 24 l20 -24z" fill="#7a3cff"/>
<rect x="40" y="350" width="720" height="154" rx="18" fill="#7a3cff"/>
<text x="70" y="400" font-size="30" font-weight="800" fill="#fff">2. Find actual CPA</text>
<text x="70" y="442" font-size="25" fill="#ece1ff">Spend divided by conversions, same event,</text>
<text x="70" y="474" font-size="25" fill="#ece1ff">same window. $400 and 10 buys = $40</text>
<path d="M400 508 v24" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round"/><path d="M380 526 l20 24 l20 -24z" fill="#ff5a1f"/>
<rect x="40" y="560" width="720" height="154" rx="18" fill="#ff5a1f"/>
<text x="70" y="610" font-size="30" font-weight="800" fill="#fff">3. Set the target</text>
<text x="70" y="652" font-size="25" fill="#ffffff">Start near actual CPA and what a conversion</text>
<text x="70" y="684" font-size="25" fill="#ffffff">is worth. Half of actual will not deliver half</text>
<path d="M400 718 v24" stroke="#0b8f6a" stroke-width="8" stroke-linecap="round"/><path d="M380 736 l20 24 l20 -24z" fill="#0b8f6a"/>
<rect x="40" y="770" width="720" height="154" rx="18" fill="#0b8f6a"/>
<text x="70" y="820" font-size="30" font-weight="800" fill="#fff">4. Review as it learns</text>
<text x="70" y="862" font-size="25" fill="#e8fff6">Watch spend, results and average cost</text>
<text x="70" y="894" font-size="25" fill="#e8fff6">together. A tight target can leave budget unspent</text>
</g></svg>
